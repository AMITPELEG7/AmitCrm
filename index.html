<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Crect x='6' y='8' width='6' height='16' rx='2' fill='white'/%3E%3Crect x='14' y='8' width='6' height='11' rx='2' fill='white'/%3E%3Crect x='22' y='8' width='4' height='7' rx='2' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1f2430; --muted: #6b7280; --line: #e2e5ea;
    --accent: #2563eb; --accent-soft: #e8effd;
    --fail: #dc2626; --fail-soft: #fdecec; --ok: #16a34a; --ok-soft: #e6f6ec;
    --shadow: 0 1px 2px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1e2126; --text: #e8eaee; --muted: #9aa1ad; --line: #2d3138;
      --accent: #6b9bff; --accent-soft: #1f2a44;
      --fail: #f87171; --fail-soft: #3a1f1f; --ok: #4ade80; --ok-soft: #173325;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover:not(:disabled) { border-color: var(--fail); color: var(--fail); }
  button.link { border: 0; background: none; color: var(--muted); padding: 4px 6px; text-decoration: underline; }
  input, select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- top bar ---------- */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group.grow { flex: 1; min-width: 220px; }
  .group.grow input { flex: 1; min-width: 0; }
  #saveState { color: var(--muted); font-size: 13px; }
  #saveState.error { color: var(--fail); }

  /* ---------- board ---------- */
  #board {
    flex: 1; display: flex; gap: 14px; align-items: flex-start;
    padding: 16px 16px 130px; overflow-x: auto;
  }
  .col {
    flex: 0 0 264px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; max-height: 100%;
  }
  .col.over { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .col-title { margin: 0; font-size: 15px; font-weight: 600; flex: 1; overflow-wrap: anywhere; }
  .count { color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 2px; opacity: 0; transition: opacity .1s; }
  .col-head:hover .tools, .col-head:focus-within .tools,
  .card:hover .tools, .card:focus-within .tools { opacity: 1; }
  button.icon {
    border: 0; background: none; padding: 2px 6px; color: var(--muted); border-radius: 6px; line-height: 1.2;
  }
  button.icon:hover:not(:disabled) { background: var(--line); color: var(--text); }
  .cards { display: flex; flex-direction: column; gap: 8px; padding: 6px 10px 12px; min-height: 64px; }
  .cards:empty::before, .cards.empty::before {
    content: "גרור לכאן"; color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); cursor: grab;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { cursor: grabbing; }
  .card.is-dragging { opacity: .35; }
  .card-name { font-weight: 600; overflow-wrap: anywhere; }
  .card-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .card-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px;
    font-size: 12px; color: var(--muted);
  }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .chip.today { background: var(--accent-soft); color: var(--accent); }
  .chip.overdue { background: var(--fail-soft); color: var(--fail); }
  .drop-line { height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; flex: none; }
  .add-col {
    flex: 0 0 200px; border: 2px dashed var(--line); background: none; border-radius: 12px;
    padding: 14px; color: var(--muted);
  }
  .add-col:hover { border-color: var(--accent); color: var(--accent); }
  .empty-board { margin: 60px auto; text-align: center; color: var(--muted); }
  .empty-board button { margin-top: 12px; }

  /* ---------- failed / closed drop zones ---------- */
  #dropzones {
    position: fixed; inset-inline: 16px; bottom: 16px; height: 96px; display: flex; gap: 16px;
    z-index: 30; opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  /* Only opacity fades: the zones are droppable from the very first frame of a drag (no visibility/transform delay). */
  body.dragging #dropzones { opacity: 1; pointer-events: auto; }
  .zone {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 22px; font-weight: 700; text-align: center; padding: 0 12px;
    border: 3px dashed; border-radius: 16px; background: var(--panel);
  }
  .zone.fail { color: var(--fail); border-color: var(--fail); }
  .zone.ok { color: var(--ok); border-color: var(--ok); }
  .zone.fail.over { background: var(--fail-soft); border-style: solid; }
  .zone.ok.over { background: var(--ok-soft); border-style: solid; }

  /* ---------- dialogs ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--panel);
    color: var(--text); width: min(460px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h3 { margin: 0 0 10px; font-size: 17px; }
  dialog p { margin: 0 0 12px; color: var(--muted); }
  dialog input { width: 100%; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; justify-content: flex-start; }
  #archiveDialog { width: min(560px, 94vw); }
  .arch-section { margin-top: 14px; }
  .arch-section h4 { margin: 0 0 6px; font-size: 14px; }
  .arch-section.fail h4 { color: var(--fail); }
  .arch-section.ok h4 { color: var(--ok); }
  .arch-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 6px;
  }
  .arch-row .arch-name { flex: 1; overflow-wrap: anywhere; text-align: start; border: 0; background: none; padding: 2px 0; }
  .arch-row .arch-name:hover { color: var(--accent); text-decoration: underline; }
  .arch-none { color: var(--muted); font-size: 13px; }

  /* ---------- lead dialog ---------- */
  #leadDialog { width: min(660px, 94vw); max-height: 92vh; overflow: auto; }
  .lead-meta { margin: -4px 0 14px; color: var(--muted); font-size: 13px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 14px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
  .field-head a { font-size: 12px; color: var(--accent); }
  .field .req { color: var(--fail); }
  .field input, .field textarea { margin: 0; }
  textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; color: inherit; resize: vertical;
  }
  .notes { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 14px; }
  .notes h4 { margin: 0 0 8px; font-size: 14px; }
  .note-add { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
  .note-add textarea { flex: 1; }
  .note { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .note-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .note-head span { flex: 1; }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .actions .push { margin-inline-start: auto; }
  .spacer { flex: 1; }
  .zone-sub { font-size: 13px; font-weight: 400; color: var(--muted); }
  .chip.meet { background: var(--ok-soft); color: var(--ok); }
  .hint { font-size: 12px; color: var(--muted); }

  /* ---------- meeting details (closing a lead in the scheduling pipeline) ---------- */
  .meeting {
    border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px;
    padding: 12px; margin-bottom: 14px;
  }
  .meeting h4 { margin: 0 0 4px; font-size: 14px; }
  .meeting .hint { margin: 0 0 8px; }
  .meeting .fields { margin-bottom: 0; }
  .fields.three { grid-template-columns: 1fr 1fr 1fr; }
  .span-all { grid-column: 1 / -1; }
  @media (max-width: 560px) { .fields.three { grid-template-columns: 1fr; } }

  /* ---------- automation dialog + toast ---------- */
  .check { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .check input { width: auto; margin: 4px 0 0; }
  #autoTarget { width: 100%; margin-bottom: 10px; }
  #toast {
    position: fixed; bottom: 20px; inset-inline: 0; margin-inline: auto; width: fit-content; max-width: 92vw;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px;
    background: #1f2430; color: #fff; z-index: 120; box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
  }
  /* The toast sits over the drop zones, so it must never intercept a drop while a drag is in progress. */
  body.dragging #toast { visibility: hidden; }
  #toast span { overflow-wrap: anywhere; }

  /* The lead dialog can be tall (meeting section + notes): keep its action buttons in view. */
  #leadForm > .actions {
    position: sticky; bottom: -20px; margin: 0 -20px -20px; padding: 12px 20px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #toast button { background: none; border-color: #fff; color: #fff; padding: 3px 10px; }

  /* ---------- visible error bar (so a failure is never silent) ---------- */
  #errorBar {
    position: fixed; top: 0; inset-inline: 0; z-index: 100; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--fail); color: #fff; font-size: 14px;
  }
  #errorBar span { flex: 1; overflow-wrap: anywhere; }
  #errorBar button { background: none; border-color: #fff; color: #fff; padding: 3px 10px; }

  /* ---------- connect gate ---------- */
  #gate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; }
  #gateBox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px;
    width: min(460px, 100%); box-shadow: var(--shadow);
  }
  #gateBox h1 { margin: 0 0 8px; font-size: 22px; }
  #gateBox p { margin: 0 0 16px; color: var(--muted); }
  #gateBox .err { color: var(--fail); }
  #gateBox .actions { flex-wrap: wrap; }
</style>
</head>
<body>

<header class="bar">
  <div class="group">
    <select id="pipelineSelect" aria-label="בחירת פייפ-ליין"></select>
    <button id="addPipelineBtn" type="button">+ פייפ-ליין</button>
    <button id="renamePipelineBtn" type="button">שנה שם</button>
    <button id="automationBtn" type="button">אוטומציה</button>
    <button id="deletePipelineBtn" type="button" class="danger">מחק</button>
  </div>
  <button id="addLeadBtn" type="button" class="primary">+ ליד חדש</button>
  <div class="spacer"></div>
  <div class="group">
    <button id="archiveBtn" type="button">נכשלו / נסגרו</button>
    <span id="saveState" role="status"></span>
    <button id="switchFileBtn" type="button" class="link">החלף קובץ</button>
  </div>
</header>

<main id="board"></main>

<div id="dropzones" aria-hidden="true">
  <div class="zone fail" data-outcome="failed">נכשל</div>
  <div class="zone ok" data-outcome="closed"><span>נסגר</span><small class="zone-sub"></small></div>
</div>

<dialog id="archiveDialog">
  <h3 id="archiveTitle">נכשלו / נסגרו</h3>
  <div id="archiveBody"></div>
  <div class="actions" style="margin-top:16px"><button id="archiveClose" type="button">סגור</button></div>
</dialog>

<dialog id="leadDialog">
  <form id="leadForm" autocomplete="off">
    <h3 id="leadTitle"></h3>
    <div id="leadLast" class="lead-meta"></div>
    <div class="fields">
      <div class="field">
        <div class="field-head"><label for="fName">שם מלא <span class="req">*</span></label></div>
        <input id="fName" required maxlength="120">
      </div>
      <div class="field">
        <div class="field-head"><label for="fPhone">טלפון <span class="req">*</span></label></div>
        <input id="fPhone" type="tel" required maxlength="40" dir="auto">
      </div>
      <div class="field">
        <div class="field-head"><label for="fEmail">אימייל</label></div>
        <input id="fEmail" type="email" maxlength="200" dir="auto">
      </div>
      <div class="field">
        <div class="field-head"><label for="fCompany">חברה</label></div>
        <input id="fCompany" maxlength="120">
      </div>
      <div class="field">
        <div class="field-head"><label for="fCategory">קטגוריה / התמחות</label></div>
        <input id="fCategory" list="categoryList" maxlength="120">
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field">
        <div class="field-head"><label for="fWebsite">אתר</label><a id="fWebsiteLink" target="_blank" rel="noopener noreferrer" hidden>פתח ↗</a></div>
        <input id="fWebsite" inputmode="url" maxlength="300" dir="auto">
      </div>
      <div class="field">
        <div class="field-head"><label for="fFollow">מועד מעקב הבא</label></div>
        <input id="fFollow" type="date">
      </div>
    </div>

    <section id="meetingSection" class="meeting" hidden>
      <h4>פרטי הפגישה</h4>
      <p id="meetingNote" class="hint" hidden></p>
      <div class="fields three">
        <div class="field">
          <div class="field-head"><label for="fMDate">יום <span class="req">*</span></label></div>
          <input id="fMDate" type="date">
        </div>
        <div class="field">
          <div class="field-head"><label for="fMTime">שעת התחלה <span class="req">*</span></label></div>
          <input id="fMTime" type="time">
        </div>
        <div class="field">
          <div class="field-head"><label for="fMEnd">שעת סיום</label></div>
          <input id="fMEnd" type="time">
          <div id="fMEndHint" class="hint"></div>
        </div>
        <div class="field span-all">
          <div class="field-head"><label for="fMLoc">מיקום</label></div>
          <input id="fMLoc" maxlength="300">
        </div>
        <div class="field span-all">
          <div class="field-head"><label for="fMGuests">אורחים</label></div>
          <textarea id="fMGuests" rows="2" dir="auto"></textarea>
          <div class="hint">כתובות מייל, מופרדות בפסיק או בשורה חדשה</div>
        </div>
      </div>
    </section>

    <div id="firstNoteWrap" class="field" style="margin-bottom:14px">
      <div class="field-head"><label for="fFirstNote">הערה ראשונה (לא חובה)</label></div>
      <textarea id="fFirstNote" rows="3"></textarea>
    </div>

    <section id="notesSection" class="notes" hidden>
      <h4 id="notesTitle">הערות</h4>
      <div class="note-add">
        <textarea id="noteInput" rows="2" placeholder="הוסף הערה… (Ctrl+Enter להוספה)" aria-label="הערה חדשה"></textarea>
        <button id="noteAddBtn" type="button">הוסף הערה</button>
      </div>
      <div id="notesList"></div>
    </section>

    <div class="actions">
      <button id="leadSave" class="primary">שמור</button>
      <button id="leadCancel" type="button">ביטול</button>
      <button id="leadDelete" type="button" class="danger push">מחק ליד</button>
    </div>
  </form>
</dialog>

<dialog id="autoDialog">
  <form id="autoForm">
    <h3 id="autoTitle"></h3>
    <label class="check"><input type="checkbox" id="autoOn"><span>כשליד נסגר בפייפ-ליין הזה: פתח חלון תיאום פגישה והעבר את הליד לפייפ-ליין:</span></label>
    <select id="autoTarget" aria-label="פייפ-ליין יעד"></select>
    <p class="hint">הליד עובר לסטטוס הראשון בפייפ-ליין שנבחר. "נכשל" לא מושפע.</p>
    <p id="autoNone" class="hint" hidden>צריך לפחות פייפ-ליין נוסף אחד כדי להפעיל את האוטומציה.</p>
    <div class="actions">
      <button class="primary">שמור</button>
      <button id="autoCancel" type="button">ביטול</button>
    </div>
  </form>
</dialog>

<dialog id="askDialog">
  <form id="askForm">
    <h3 id="askTitle"></h3>
    <p id="askMsg"></p>
    <input id="askInput">
    <div class="actions">
      <button id="askOk" class="primary">אישור</button>
      <button id="askCancel" type="button">ביטול</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>
<div id="errorBar" role="alert" hidden></div>

<div id="gate" hidden><div id="gateBox"></div></div>

<script>
'use strict';

/* ================= helpers ================= */
const $ = (sel, root = document) => root.querySelector(sel);

// Builds DOM without innerHTML, so lead/status names can never be interpreted as markup.
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
// Any uncaught error is shown in a red bar instead of failing silently.
function showError(message) {
  const bar = $('#errorBar');
  bar.replaceChildren(h('span', {}, `משהו השתבש: ${message}`), h('button', { type: 'button', onclick: () => { bar.hidden = true; } }, 'סגור'));
  bar.hidden = false;
}
window.addEventListener('error', e => showError(e.message || 'שגיאה לא ידועה'));
window.addEventListener('unhandledrejection', e => showError((e.reason && e.reason.message) || String(e.reason)));

const uid = () => crypto.randomUUID();
const iconBtn = (glyph, label, onclick, disabled = false) =>
  h('button', { class: 'icon', type: 'button', 'aria-label': label, title: label, onclick, disabled }, glyph);

/* ================= data model ================= */
// state = { version, activePipelineId, pipelines: [{ id, name, statuses: [{id, name}], leads: [Lead] }] }
// Lead = { id, name*, phone*, email, company, category, website,
//          nextFollowUp: 'YYYY-MM-DD' | '', notes: [{ id, text, at }],
//          statusId, outcome: null | 'failed' | 'closed', createdAt }      (* = required)
//          meeting: null | { date: 'YYYY-MM-DD', time: 'HH:MM', endTime: 'HH:MM' | '' (empty = 30 min), location, guests: [email] }
// Pipeline.onClose: undefined (never set up) | null (switched off) | { action: 'meeting', targetPipelineId }
//   -> dropping a lead on "נסגר" opens the meeting dialog and, on confirm, moves the lead to the target pipeline's first status.
// "Last contact" is not stored: it is the timestamp of the newest note.
// A lead with an outcome is off the board but keeps its last statusId, so "return to board" restores it.
const DEFAULT_STATUSES = ['חדש', 'בקשר', 'פגישה', 'הצעת מחיר'];
// Pipelines with these exact names are wired together automatically the first time they are seen (see autoWireMeetings).
const MEETING_PIPELINE = 'תיאום פגישות', SALES_PIPELINE = 'מכירות';
const DEFAULT_MEETING_MIN = 30;

function newPipeline(name) {
  return { id: uid(), name, statuses: DEFAULT_STATUSES.map(n => ({ id: uid(), name: n })), leads: [] };
}
function defaultState() {
  const p = newPipeline('מכירות');
  return { version: 1, activePipelineId: p.id, pipelines: [p] };
}
function normalizeMeeting(m) {
  if (!m || typeof m !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(m.date) || !/^\d{2}:\d{2}$/.test(m.time)) return null;
  return {
    ...m, date: m.date, time: m.time,
    endTime: /^\d{2}:\d{2}$/.test(m.endTime) ? m.endTime : '',
    location: String(m.location ?? ''),
    guests: (Array.isArray(m.guests) ? m.guests : []).map(String).filter(Boolean),
  };
}
// Only touches a pipeline that was never configured (onClose === undefined), so switching it off sticks.
function autoWireMeetings(pipelines) {
  const sched = pipelines.find(p => p.name.trim() === MEETING_PIPELINE);
  const sales = pipelines.find(p => p.name.trim() === SALES_PIPELINE);
  if (sched && sales && sched.onClose === undefined) sched.onClose = { action: 'meeting', targetPipelineId: sales.id };
}
// Spreads keep unknown fields, so data written by a newer version is not dropped on save.
function normalize(d) {
  const pipelines = d.pipelines.map(p => {
    const statuses = (p.statuses || []).map(s => ({ ...s, id: s.id || uid(), name: String(s.name ?? '') }));
    if (!statuses.length) statuses.push({ id: uid(), name: DEFAULT_STATUSES[0] });
    const ids = new Set(statuses.map(s => s.id));
    const leads = (p.leads || []).map(l => ({
      ...l, id: l.id || uid(), name: String(l.name ?? ''),
      phone: String(l.phone ?? ''), email: String(l.email ?? ''), company: String(l.company ?? ''),
      category: String(l.category ?? ''), website: String(l.website ?? ''),
      nextFollowUp: /^\d{4}-\d{2}-\d{2}$/.test(l.nextFollowUp) ? l.nextFollowUp : '',
      notes: (Array.isArray(l.notes) ? l.notes : [])
        .filter(n => n && typeof n.text === 'string')
        .map(n => ({ ...n, id: n.id || uid(), at: Number(n.at) || Date.now() })),
      statusId: ids.has(l.statusId) ? l.statusId : statuses[0].id,
      outcome: l.outcome === 'failed' || l.outcome === 'closed' ? l.outcome : null,
      createdAt: l.createdAt || Date.now(),
      meeting: normalizeMeeting(l.meeting),
    }));
    const onClose = p.onClose === undefined ? undefined
      : (p.onClose && typeof p.onClose.targetPipelineId === 'string' ? { action: 'meeting', targetPipelineId: p.onClose.targetPipelineId } : null);
    return { ...p, id: p.id || uid(), name: String(p.name || 'ללא שם'), statuses, leads, onClose };
  });
  autoWireMeetings(pipelines);
  const active = pipelines.some(p => p.id === d.activePipelineId) ? d.activePipelineId : (pipelines[0]?.id ?? null);
  return { ...d, version: 1, activePipelineId: active, pipelines };
}

let state = null;

/* ---- dates & lead helpers ---- */
const pad = n => String(n).padStart(2, '0');
const fmtDate = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDateTime = ms => { const d = new Date(ms); return `${fmtDate(ms)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtIso = iso => iso.split('-').reverse().join('/');
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
// Whole calendar days between a timestamp and today (rounding absorbs the 23/25-hour daylight-saving days).
function daysAgo(ms) {
  const a = new Date(ms), b = new Date();
  const dayA = new Date(a.getFullYear(), a.getMonth(), a.getDate()), dayB = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.max(0, Math.round((dayB - dayA) / 86400000));
}
const relDays = ms => { const n = daysAgo(ms); return n === 0 ? 'היום' : n === 1 ? 'אתמול' : `לפני ${n} ימים`; };
const lastContactAt = lead => lead.notes.length ? Math.max(...lead.notes.map(n => n.at)) : null;
function followUpInfo(lead) {
  if (!lead.nextFollowUp) return null;
  const t = todayIso();
  if (lead.nextFollowUp < t) return { cls: 'overdue', text: `מעקב: ${fmtIso(lead.nextFollowUp)} (באיחור)` };
  if (lead.nextFollowUp === t) return { cls: 'today', text: 'מעקב: היום' };
  return { cls: '', text: `מעקב: ${fmtIso(lead.nextFollowUp)}` };
}
// Only http(s) links are ever made clickable; anything else (e.g. "javascript:...") stays plain text.
function safeUrl(raw) {
  const t = String(raw).trim();
  if (!t) return null;
  if (/^[a-z][a-z0-9+.-]*:(?!\d)/i.test(t) && !/^https?:\/\//i.test(t)) return null;
  try {
    const u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t);
    return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : null;
  } catch { return null; }
}

/* ---- meetings & automation helpers ---- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const timeToMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
// End time used when none is entered: start + 30 minutes (may roll over to the next day).
function defaultEnd(dateIso, time) {
  const [y, mo, d] = dateIso ? dateIso.split('-').map(Number) : [2000, 1, 1];
  const [h, mi] = time.split(':').map(Number);
  const end = new Date(y, mo - 1, d, h, mi + DEFAULT_MEETING_MIN);
  return { time: `${pad(end.getHours())}:${pad(end.getMinutes())}`, nextDay: end.getDate() !== d };
}
// The pipeline a lead is handed to when it is dropped on "נסגר", or null when this pipeline has no (valid) automation.
function closeAutomation(p) {
  if (!p || !p.onClose || !state) return null;
  const target = state.pipelines.find(x => x.id === p.onClose.targetPipelineId && x !== p);
  return target && target.statuses.length ? { target } : null;
}
let toastTimer = null;
function showToast(text, actionLabel, onAction) {
  const el = $('#toast');
  el.replaceChildren(h('span', {}, text),
    actionLabel ? h('button', { type: 'button', onclick: () => { el.hidden = true; onAction(); } }, actionLabel) : null);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 8000);
}

/* ================= file storage (File System Access API) ================= */
const PICKER_TYPES = [{ description: 'קובץ נתוני CRM', accept: { 'application/json': ['.json'] } }];
const DB_NAME = 'amitcrm', STORE = 'kv', HANDLE_KEY = 'fileHandle';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const q = db.transaction(STORE).objectStore(STORE).get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}
async function idbSet(key, value) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function hasPermission(handle, ask) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if (!ask) return false;
  return (await handle.requestPermission(opts)) === 'granted';
}
async function writeState(handle, data) {
  const w = await handle.createWritable();
  await w.write(JSON.stringify(data, null, 2));
  await w.close();
}
async function readState(handle) {
  const text = await (await handle.getFile()).text();
  if (!text.trim()) return defaultState();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('הקובץ שנבחר אינו JSON תקין.'); }
  if (!data || !Array.isArray(data.pipelines)) throw new Error('הקובץ שנבחר אינו קובץ נתונים של ה-CRM.');
  return normalize(data);
}

// Saves are serialized: while one write runs, further changes just mark the state dirty and get written right after.
let saving = false, dirty = false;
function scheduleSave() { dirty = true; if (!saving) flushSave(); }
async function flushSave() {
  if (!fileHandle) return;
  saving = true;
  setSaveState('saving');
  try {
    while (dirty) {
      dirty = false;
      await writeState(fileHandle, state);
    }
    setSaveState('saved');
  } catch (e) {
    dirty = true; // keep it pending so the next change retries
    setSaveState('error');
    console.error('save failed', e);
  } finally {
    saving = false;
  }
}
function setSaveState(kind) {
  const el = $('#saveState');
  el.classList.toggle('error', kind === 'error');
  if (kind === 'saving') el.textContent = 'שומר…';
  else if (kind === 'error') el.textContent = 'השמירה נכשלה — בדוק שהקובץ נגיש';
  else el.textContent = `נשמר ב-${fileHandle ? fileHandle.name : ''} · ${new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })}`;
}
window.addEventListener('beforeunload', e => { if (saving || dirty) e.preventDefault(); });

async function activate(handle, data) {
  fileHandle = handle;
  state = data;
  try { await idbSet(HANDLE_KEY, handle); } catch (e) { console.warn('could not remember the file', e); }
  $('#gate').hidden = true;
  render();
  setSaveState('saved');
}

/* ---- connect screen ---- */
function showGate(kind, info = {}) {
  const box = $('#gateBox');
  box.replaceChildren();
  $('#gate').hidden = false;
  const err = info.error ? h('p', { class: 'err' }, info.error) : null;

  if (kind === 'unsupported') {
    box.append(h('h1', {}, 'הדפדפן לא נתמך'),
      h('p', {}, 'שמירה לקובץ במחשב עובדת רק ב-Chrome או ב-Edge. פתח את הדף באחד מהם.'));
    return;
  }
  if (kind === 'resume') {
    box.append(h('h1', {}, 'המשך עבודה'),
      h('p', {}, `הדפדפן צריך את אישורך כדי להמשיך לעבוד עם הקובץ ${info.handle.name}.`), err,
      h('div', { class: 'actions' },
        h('button', { class: 'primary', type: 'button', onclick: () => resume(info.handle) }, 'המשך'),
        h('button', { type: 'button', onclick: () => showGate('connect') }, 'בחר קובץ אחר')));
    return;
  }
  box.append(h('h1', {}, 'ה-CRM שלי'),
    h('p', {}, 'הנתונים נשמרים בקובץ במחשב שלך. בחר איפה לשמור אותם.'), err,
    h('div', { class: 'actions' },
      h('button', { class: 'primary', type: 'button', onclick: connectNew }, 'צור קובץ נתונים חדש'),
      h('button', { type: 'button', onclick: connectOpen }, 'פתח קובץ קיים'),
      info.cancelable ? h('button', { class: 'link', type: 'button', onclick: () => { $('#gate').hidden = true; } }, 'ביטול') : null));
}

async function connectNew() {
  try {
    const handle = await showSaveFilePicker({ suggestedName: 'crm-data.json', types: PICKER_TYPES, startIn: 'documents' });
    const fresh = defaultState();
    await writeState(handle, fresh);
    await activate(handle, fresh);
  } catch (e) {
    if (e.name !== 'AbortError') showGate('connect', { error: e.message });
  }
}
async function connectOpen() {
  let handle;
  try {
    [handle] = await showOpenFilePicker({ types: PICKER_TYPES, multiple: false, startIn: 'documents' });
  } catch (e) {
    if (e.name !== 'AbortError') showGate('connect', { error: e.message });
    return;
  }
  await resume(handle);
}
// Reads the file and starts working. If Chrome needs a fresh permission click, asks for it first.
async function resume(handle) {
  try {
    if (!(await hasPermission(handle, true))) return showGate('resume', { handle, error: 'לא ניתן אישור לכתוב לקובץ.' });
    await activate(handle, await readState(handle));
  } catch (e) {
    if (e.name === 'SecurityError' || e.name === 'NotAllowedError') return showGate('resume', { handle });
    showGate('connect', { error: e.message });
  }
}
async function boot() {
  if (!('showSaveFilePicker' in window)) return showGate('unsupported');
  let handle = null;
  try { handle = await idbGet(HANDLE_KEY); } catch { /* no remembered file */ }
  if (!handle) return showGate('connect');
  try {
    if (await hasPermission(handle, false)) await activate(handle, await readState(handle));
    else showGate('resume', { handle });
  } catch (e) {
    showGate('connect', { error: e.message });
  }
}

/* ================= dialogs ================= */
function ask({ title, message = '', value = null, placeholder = '', okLabel = 'אישור', danger = false }) {
  return new Promise(resolve => {
    const dlg = $('#askDialog'), form = $('#askForm'), input = $('#askInput');
    $('#askTitle').textContent = title;
    $('#askMsg').textContent = message;
    $('#askMsg').hidden = !message;
    input.hidden = value === null;
    input.required = value !== null;
    input.value = value ?? '';
    input.placeholder = placeholder;
    $('#askOk').textContent = okLabel;
    $('#askOk').classList.toggle('danger', danger);
    $('#askOk').classList.toggle('primary', !danger);
    const finish = result => {
      form.onsubmit = null; $('#askCancel').onclick = null; dlg.oncancel = null;
      dlg.close();
      resolve(result);
    };
    form.onsubmit = e => { e.preventDefault(); finish(value === null ? true : input.value.trim() || null); };
    $('#askCancel').onclick = () => finish(value === null ? false : null);
    dlg.oncancel = e => { e.preventDefault(); finish(value === null ? false : null); };
    dlg.showModal();
    if (value !== null) { input.focus(); input.select(); } else $('#askOk').focus();
  });
}
const askText = (title, value = '', placeholder = '') => ask({ title, value, placeholder });
const askConfirm = (title, message, okLabel = 'מחק') => ask({ title, message, okLabel, danger: true });

/* ================= actions ================= */
function commit() { render(); scheduleSave(); }

async function addPipeline() {
  const name = await askText('פייפ-ליין חדש', '', 'שם הפייפ-ליין');
  if (!name) return;
  const p = newPipeline(name);
  state.pipelines.push(p);
  state.activePipelineId = p.id;
  autoWireMeetings(state.pipelines);
  commit();
}
async function renamePipeline() {
  const p = activePipeline();
  if (!p) return;
  const name = await askText('שינוי שם פייפ-ליין', p.name);
  if (!name) return;
  p.name = name;
  autoWireMeetings(state.pipelines);
  commit();
}
async function deletePipeline() {
  const p = activePipeline();
  if (!p) return;
  const n = p.leads.length;
  const msg = n ? `הפייפ-ליין "${p.name}" וכל ${n} הלידים שבו יימחקו. אי אפשר לשחזר.` : `הפייפ-ליין "${p.name}" יימחק.`;
  if (!(await askConfirm('מחיקת פייפ-ליין', msg))) return;
  state.pipelines = state.pipelines.filter(x => x !== p);
  state.activePipelineId = state.pipelines[0]?.id ?? null;
  commit();
}

async function addStatus() {
  const p = activePipeline();
  const name = await askText('סטטוס חדש', '', 'שם הסטטוס');
  if (!p || !name) return;
  p.statuses.push({ id: uid(), name });
  commit();
}
async function renameStatus(s) {
  const name = await askText('שינוי שם סטטוס', s.name);
  if (!name) return;
  s.name = name;
  commit();
}
function moveStatus(s, delta) {
  const arr = activePipeline().statuses;
  const i = arr.indexOf(s), j = i + delta;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}
async function deleteStatus(s) {
  const p = activePipeline();
  if (p.statuses.length <= 1) return;
  const target = p.statuses.find(x => x !== s);
  const onBoard = p.leads.filter(l => l.statusId === s.id && !l.outcome).length;
  if (onBoard && !(await askConfirm('מחיקת סטטוס', `ב-"${s.name}" יש ${onBoard} לידים. הם יועברו ל-"${target.name}".`, 'מחק סטטוס'))) return;
  p.leads.forEach(l => { if (l.statusId === s.id) l.statusId = target.id; });
  p.statuses = p.statuses.filter(x => x !== s);
  commit();
}

async function deleteLead(l) {
  if (!(await askConfirm('מחיקת ליד', `הליד "${l.name}" יימחק. אי אפשר לשחזר.`))) return false;
  const p = activePipeline();
  p.leads = p.leads.filter(x => x !== l);
  commit();
  return true;
}

/* ---- lead dialog: create + edit ---- */
let editingId = null; // null while creating a new lead
let meetingMode = false; // true while a lead is being closed in a pipeline that has the meeting automation
const currentLead = () => (editingId ? activePipeline()?.leads.find(l => l.id === editingId) : null) || null;

function openLead(id, opts = {}) {
  // Already open (e.g. a second click arriving right after a drop, or a double-click): leave what the user is editing alone.
  if ($('#leadDialog').open) return;
  const p = activePipeline();
  if (!p) return;
  const lead = id ? p.leads.find(l => l.id === id) : null;
  if (id && !lead) return;
  editingId = lead ? lead.id : null;
  const auto = lead && opts.meeting ? closeAutomation(p) : null;
  meetingMode = !!auto;
  $('#leadTitle').textContent = meetingMode ? `תיאום פגישה: ${lead.name}` : lead ? (lead.name || 'ליד ללא שם') : 'ליד חדש';
  $('#fName').value = lead?.name ?? '';
  $('#fPhone').value = lead?.phone ?? '';
  $('#fEmail').value = lead?.email ?? '';
  $('#fCompany').value = lead?.company ?? '';
  $('#fCategory').value = lead?.category ?? '';
  $('#fWebsite').value = lead?.website ?? '';
  $('#fFollow').value = lead?.nextFollowUp ?? '';
  $('#fFirstNote').value = '';
  $('#noteInput').value = '';
  $('#firstNoteWrap').hidden = !!lead;
  $('#notesSection').hidden = !lead;
  // The meeting section shows while closing a lead here, and for any lead that already has a meeting.
  const showMeeting = meetingMode || !!(lead && lead.meeting);
  const m = lead?.meeting;
  $('#fMDate').value = m?.date ?? '';
  $('#fMTime').value = m?.time ?? '';
  $('#fMEnd').value = m?.endTime ?? '';
  $('#fMLoc').value = m?.location ?? '';
  $('#fMGuests').value = m ? m.guests.join('\n') : (meetingMode ? lead.email : '');
  $('#meetingSection').hidden = !showMeeting;
  for (const sel of ['#fMDate', '#fMTime']) $(sel).required = showMeeting; // a required field inside a hidden section would block the form
  const note = $('#meetingNote');
  note.hidden = !meetingMode;
  if (meetingMode) note.textContent = `אחרי האישור הליד עובר ל"${auto.target.name}" ‹ ${auto.target.statuses[0].name}. ביטול משאיר אותו במקומו.`;
  for (const sel of ['#fMEnd', '#fMGuests']) $(sel).setCustomValidity('');
  updateEndHint();
  $('#leadDelete').hidden = !lead || meetingMode;
  $('#leadSave').textContent = meetingMode ? `תאם פגישה והעבר ל"${auto.target.name}"` : lead ? 'שמור' : 'צור ליד';
  const cats = new Set(state.pipelines.flatMap(x => x.leads.map(l => l.category)).filter(Boolean));
  $('#categoryList').replaceChildren(...[...cats].sort((a, b) => a.localeCompare(b, 'he')).map(c => h('option', { value: c })));
  updateWebsiteLink();
  renderLeadNotes();
  $('#leadDialog').showModal();
  (meetingMode ? $('#fMDate') : $('#fName')).focus();
}
function updateEndHint() {
  const time = $('#fMTime').value;
  const hint = $('#fMEndHint');
  if (!time) { hint.textContent = `אם ריק: ${DEFAULT_MEETING_MIN} דקות אחרי ההתחלה`; return; }
  const end = defaultEnd($('#fMDate').value, time);
  hint.textContent = `אם ריק: ${end.time}${end.nextDay ? ' (למחרת)' : ''}`;
}
// Returns the validated meeting object, or null after flagging the problem field.
function readMeeting() {
  const date = $('#fMDate').value, time = $('#fMTime').value, endTime = $('#fMEnd').value;
  const fail = (el, msg) => { el.setCustomValidity(msg); el.reportValidity(); return null; };
  if (!date || !time) return fail($(date ? '#fMTime' : '#fMDate'), 'יש למלא יום ושעה');
  if (endTime && timeToMin(endTime) <= timeToMin(time)) return fail($('#fMEnd'), 'שעת הסיום חייבת להיות אחרי שעת ההתחלה');
  const seen = new Set();
  const guests = $('#fMGuests').value.split(/[\s,;]+/).filter(Boolean)
    .filter(g => { const k = g.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  const bad = guests.find(g => !EMAIL_RE.test(g));
  if (bad) return fail($('#fMGuests'), `כתובת המייל "${bad}" אינה תקינה`);
  return { date, time, endTime, location: $('#fMLoc').value.trim(), guests };
}
function updateWebsiteLink() {
  const url = safeUrl($('#fWebsite').value);
  const a = $('#fWebsiteLink');
  a.hidden = !url;
  if (url) a.href = url; else a.removeAttribute('href');
}
function renderLeadNotes() {
  const lead = currentLead();
  const meta = $('#leadLast');
  if (!lead) { meta.textContent = ''; return; }
  const last = lastContactAt(lead);
  meta.textContent = last ? `פנייה אחרונה: ${fmtDate(last)} (${relDays(last)})` : 'עדיין אין פנייה. הוספת הערה תקבע את תאריך הפנייה האחרונה.';
  $('#notesTitle').textContent = `הערות (${lead.notes.length})`;
  // Newest first; equal timestamps fall back to insertion order so the latest-added note still comes first.
  const newestFirst = lead.notes.map((n, i) => ({ n, i })).sort((a, b) => b.n.at - a.n.at || b.i - a.i).map(x => x.n);
  $('#notesList').replaceChildren(...newestFirst.map(n => h('div', { class: 'note' },
    h('div', { class: 'note-head' }, h('span', {}, fmtDateTime(n.at)), iconBtn('✕', 'מחק הערה', () => deleteNote(n.id))),
    h('div', { class: 'note-text' }, n.text))));
}
function addNote() {
  const lead = currentLead();
  const input = $('#noteInput');
  const text = input.value.trim();
  if (!lead || !text) return;
  lead.notes.push({ id: uid(), text, at: Date.now() });
  input.value = '';
  renderLeadNotes();
  commit();
  input.focus();
}
async function deleteNote(noteId) {
  const lead = currentLead();
  if (!lead || !(await askConfirm('מחיקת הערה', 'ההערה תימחק, וזה עשוי לשנות את תאריך הפנייה האחרונה.'))) return;
  lead.notes = lead.notes.filter(n => n.id !== noteId);
  renderLeadNotes();
  commit();
}
function saveLead() {
  const v = {
    name: $('#fName').value.trim(), phone: $('#fPhone').value.trim(), email: $('#fEmail').value.trim(),
    company: $('#fCompany').value.trim(), category: $('#fCategory').value.trim(),
    website: $('#fWebsite').value.trim(), nextFollowUp: $('#fFollow').value,
  };
  // Whitespace-only passes the native "required" check, so blank the field and let the browser flag it.
  for (const [key, id] of [['name', '#fName'], ['phone', '#fPhone']]) {
    if (!v[key]) { $(id).value = ''; $(id).reportValidity(); return; }
  }
  const p = activePipeline();
  const lead = currentLead();
  let meeting = null;
  if (!$('#meetingSection').hidden) {
    meeting = readMeeting();
    if (!meeting) return;
  }
  if (lead) {
    Object.assign(lead, v);
    if (meeting) lead.meeting = meeting;
  } else {
    const created = { id: uid(), ...v, meeting: null, notes: [], statusId: p.statuses[0].id, outcome: null, createdAt: Date.now() };
    const first = $('#fFirstNote').value.trim();
    if (first) created.notes.push({ id: uid(), text: first, at: Date.now() });
    p.leads.push(created);
  }
  // Closing in a pipeline with the meeting automation: the lead leaves it and lands in the target's first status.
  const auto = meetingMode && lead ? closeAutomation(p) : null;
  if (auto) {
    p.leads = p.leads.filter(l => l !== lead);
    lead.statusId = auto.target.statuses[0].id;
    lead.outcome = null;
    auto.target.leads.push(lead);
  }
  $('#leadDialog').close();
  commit();
  if (auto) {
    showToast(`הליד "${lead.name}" הועבר ל"${auto.target.name}" ‹ ${auto.target.statuses[0].name}`, `הצג את "${auto.target.name}"`,
      () => { state.activePipelineId = auto.target.id; commit(); });
  }
}
function moveLead(id, statusId, beforeId) {
  const p = activePipeline();
  const lead = p.leads.find(l => l.id === id);
  if (!lead) return;
  p.leads = p.leads.filter(l => l !== lead);
  lead.statusId = statusId;
  lead.outcome = null;
  const idx = beforeId ? p.leads.findIndex(l => l.id === beforeId) : -1;
  if (idx >= 0) p.leads.splice(idx, 0, lead); else p.leads.push(lead);
  commit();
}
function setOutcome(id, outcome) {
  const lead = activePipeline().leads.find(l => l.id === id);
  if (!lead) return;
  lead.outcome = outcome;
  commit();
}
// A drop on "נסגר" in a pipeline with the meeting automation opens the meeting dialog instead of just closing the lead.
function dropOutcome(id, outcome) {
  if (outcome === 'closed' && closeAutomation(activePipeline())) { openLead(id, { meeting: true }); return; }
  setOutcome(id, outcome);
}

/* ---- automation settings ---- */
function openAutomation() {
  const p = activePipeline();
  if (!p) return;
  const others = state.pipelines.filter(x => x !== p);
  const current = closeAutomation(p);
  $('#autoTitle').textContent = `אוטומציה בסגירה: ${p.name}`;
  $('#autoTarget').replaceChildren(...others.map(x => h('option', { value: x.id, selected: !!current && current.target === x }, x.name)));
  $('#autoOn').checked = !!current;
  $('#autoOn').disabled = !others.length;
  $('#autoNone').hidden = others.length > 0;
  $('#autoTarget').disabled = !current;
  $('#autoDialog').showModal();
}
function saveAutomation() {
  const p = activePipeline();
  const target = $('#autoTarget').value;
  p.onClose = $('#autoOn').checked && target ? { action: 'meeting', targetPipelineId: target } : null;
  $('#autoDialog').close();
  commit();
}

function restoreLead(l) {
  const p = activePipeline();
  if (!p.statuses.some(s => s.id === l.statusId)) l.statusId = p.statuses[0].id;
  l.outcome = null;
  commit();
}

/* ================= rendering ================= */
function render() {
  if (!state) return;
  const p = activePipeline();

  $('#pipelineSelect').replaceChildren(
    ...state.pipelines.map(x => h('option', { value: x.id, selected: x.id === state.activePipelineId }, x.name)));
  for (const id of ['pipelineSelect', 'renamePipelineBtn', 'automationBtn', 'deletePipelineBtn', 'addLeadBtn', 'archiveBtn']) {
    $('#' + id).disabled = !p;
  }
  const auto = closeAutomation(p);
  $('.zone.ok .zone-sub').textContent = auto ? `פותח תיאום פגישה ומעביר ל"${auto.target.name}"` : '';
  const archived = p ? p.leads.filter(l => l.outcome).length : 0;
  $('#archiveBtn').textContent = archived ? `נכשלו / נסגרו (${archived})` : 'נכשלו / נסגרו';

  const board = $('#board');
  if (!p) {
    board.replaceChildren(h('div', { class: 'empty-board' },
      h('div', {}, 'אין פייפ-ליינים.'),
      h('button', { class: 'primary', type: 'button', onclick: addPipeline }, '+ צור פייפ-ליין')));
  } else {
    board.replaceChildren(
      ...p.statuses.map((s, i) => renderColumn(p, s, i)),
      h('button', { class: 'add-col', type: 'button', onclick: addStatus }, '+ סטטוס'));
  }
  if ($('#archiveDialog').open) renderArchive();
}

function renderColumn(p, s, i) {
  const leads = p.leads.filter(l => !l.outcome && l.statusId === s.id);
  return h('section', { class: 'col', 'data-status': s.id },
    h('header', { class: 'col-head' },
      h('h2', { class: 'col-title' }, s.name),
      h('span', { class: 'count' }, String(leads.length)),
      h('span', { class: 'tools' },
        iconBtn('✎', 'שנה שם', () => renameStatus(s)),
        iconBtn('→', 'הזז ימינה', () => moveStatus(s, -1), i === 0),
        iconBtn('←', 'הזז שמאלה', () => moveStatus(s, 1), i === p.statuses.length - 1),
        iconBtn('✕', 'מחק סטטוס', () => deleteStatus(s), p.statuses.length <= 1))),
    h('div', { class: 'cards' }, ...leads.map(renderCard)));
}

function renderCard(l) {
  const sub = [l.company, l.category].filter(Boolean);
  const fu = followUpInfo(l);
  const last = lastContactAt(l);
  return h('article', { class: 'card', draggable: true, tabindex: 0, 'data-id': l.id },
    h('div', { class: 'card-name' }, l.name),
    sub.length ? h('div', { class: 'card-sub' }, ...sub.flatMap((s, i) => [i ? ' · ' : null, h('bdi', {}, s)])) : null,
    l.phone ? h('div', { class: 'card-sub' }, h('span', { class: 'ltr' }, l.phone)) : null,
    h('div', { class: 'card-meta' },
      l.meeting ? h('span', { class: 'chip meet' }, `פגישה: ${fmtIso(l.meeting.date)} ${l.meeting.time}`) : null,
      fu ? h('span', { class: `chip ${fu.cls}` }, fu.text) : null,
      last ? h('span', { title: relDays(last) }, `פנייה אחרונה: ${fmtDate(last)}`) : h('span', {}, 'אין פנייה עדיין')));
}

function renderArchive() {
  const p = activePipeline();
  const body = $('#archiveBody');
  if (!p) { body.replaceChildren(); return; }
  const section = (cls, title, outcome) => {
    const rows = p.leads.filter(l => l.outcome === outcome);
    return h('div', { class: `arch-section ${cls}` },
      h('h4', {}, `${title} (${rows.length})`),
      rows.length ? rows.map(l => h('div', { class: 'arch-row' },
        h('button', { type: 'button', class: 'arch-name', title: 'פתח כרטיס ליד', onclick: () => openLead(l.id) }, l.name),
        h('button', { type: 'button', onclick: () => restoreLead(l) }, 'החזר ללוח'),
        h('button', { type: 'button', class: 'danger', onclick: () => deleteLead(l) }, 'מחק')))
        : h('div', { class: 'arch-none' }, 'אין'));
  };
  $('#archiveTitle').textContent = `נכשלו / נסגרו — ${p.name}`;
  body.replaceChildren(section('fail', 'נכשלו', 'failed'), section('ok', 'נסגרו', 'closed'));
}

/* ================= drag & drop ================= */
const board = $('#board');

function cardAfter(cardsEl, y) {
  const cards = [...cardsEl.querySelectorAll('.card:not(.is-dragging)')];
  return cards.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
}
function clearIndicators() {
  document.querySelectorAll('.drop-line').forEach(el => el.remove());
  document.querySelectorAll('.col.over, .zone.over').forEach(el => el.classList.remove('over'));
}
function endDrag() {
  dragId = null;
  document.body.classList.remove('dragging');
  document.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
  clearIndicators();
}

board.addEventListener('dragstart', e => {
  const card = e.target instanceof Element ? e.target.closest('.card') : null;
  if (!card) return;
  dragId = card.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
  // Deferred: changing the DOM inside dragstart can cancel the drag in Chrome.
  setTimeout(() => {
    if (dragId !== card.dataset.id) return;
    card.classList.add('is-dragging');
    document.body.classList.add('dragging');
  }, 0);
});
board.addEventListener('dragover', e => {
  if (!dragId) return;
  const col = e.target.closest('.col');
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const cardsEl = col.querySelector('.cards');
  document.querySelectorAll('.col.over').forEach(c => { if (c !== col) c.classList.remove('over'); });
  col.classList.add('over');
  const after = cardAfter(cardsEl, e.clientY);
  let line = cardsEl.querySelector('.drop-line');
  document.querySelectorAll('.drop-line').forEach(el => { if (el !== line) el.remove(); });
  if (!line) line = h('div', { class: 'drop-line' });
  if (line.nextElementSibling !== after || line.parentElement !== cardsEl) cardsEl.insertBefore(line, after);
});
board.addEventListener('dragleave', e => {
  if (!e.relatedTarget || !board.contains(e.relatedTarget)) clearIndicators();
});
board.addEventListener('drop', e => {
  if (!dragId) return;
  const col = e.target.closest('.col');
  if (!col) return;
  e.preventDefault();
  const after = cardAfter(col.querySelector('.cards'), e.clientY);
  const id = dragId;
  endDrag();
  moveLead(id, col.dataset.status, after ? after.dataset.id : null);
});

document.querySelectorAll('.zone').forEach(zone => {
  zone.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    if (!dragId) return;
    e.preventDefault();
    const id = dragId;
    endDrag();
    dropOutcome(id, zone.dataset.outcome);
  });
});
// Fires on the dragged card when a drag is cancelled or dropped outside any target.
window.addEventListener('dragend', endDrag);

/* ================= wiring ================= */
$('#pipelineSelect').addEventListener('change', e => { state.activePipelineId = e.target.value; commit(); });
$('#addPipelineBtn').addEventListener('click', addPipeline);
$('#renamePipelineBtn').addEventListener('click', renamePipeline);
$('#deletePipelineBtn').addEventListener('click', deletePipeline);
$('#automationBtn').addEventListener('click', openAutomation);
$('#autoOn').addEventListener('change', () => { $('#autoTarget').disabled = !$('#autoOn').checked; });
$('#autoForm').addEventListener('submit', e => { e.preventDefault(); saveAutomation(); });
$('#autoCancel').addEventListener('click', () => $('#autoDialog').close());
// Meeting fields: keep the "end time if empty" hint fresh and clear stale custom errors as soon as the user edits.
for (const sel of ['#fMDate', '#fMTime']) $(sel).addEventListener('input', () => { updateEndHint(); $('#fMEnd').setCustomValidity(''); });
$('#fMEnd').addEventListener('input', () => $('#fMEnd').setCustomValidity(''));
$('#fMGuests').addEventListener('input', () => $('#fMGuests').setCustomValidity(''));
$('#addLeadBtn').addEventListener('click', () => openLead(null));
// A click on a card opens it; a drag never produces a click, and buttons/links inside keep their own behaviour.
board.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card && !e.target.closest('a, button')) openLead(card.dataset.id);
});
board.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) openLead(e.target.dataset.id);
});
$('#leadForm').addEventListener('submit', e => { e.preventDefault(); saveLead(); });
$('#leadCancel').addEventListener('click', () => $('#leadDialog').close());
$('#leadDelete').addEventListener('click', async () => {
  const lead = currentLead();
  if (lead && await deleteLead(lead)) $('#leadDialog').close();
});
$('#fWebsite').addEventListener('input', updateWebsiteLink);
$('#noteAddBtn').addEventListener('click', addNote);
$('#noteInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addNote(); }
});
$('#archiveBtn').addEventListener('click', () => { renderArchive(); $('#archiveDialog').showModal(); });
$('#archiveClose').addEventListener('click', () => $('#archiveDialog').close());
$('#switchFileBtn').addEventListener('click', () => showGate('connect', { cancelable: true }));

boot();
</script>
</body>
